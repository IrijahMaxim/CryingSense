   ; PlatformIO Project Configuration File for CryingSense ESP32 WiFi Transmitter
;
; Upload this firmware to your ESP32 to enable WiFi audio transmission.
; Before uploading:
;   1. Update WIFI_SSID and WIFI_PASSWORD in src/main.cpp
;   2. Update SERVER_IP to your computer's IP address
;   3. Verify I2S pins match your wiring

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_protocol = esptool
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200
upload_speed = 921600

; Build flags
build_flags = 
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM=0

; Library dependencies
lib_deps =
    ; ArduinoJson is required by the HTTP config server (handleConfigPost/handleConfigGet)
    bblanchon/ArduinoJson @ ^7.0.0

; Monitor filters for better serial output
monitor_filters = 
    esp32_exception_decoder
    colorize
